spring:
  application:
    name: face-book-regression

  datasource:
    url: jdbc:postgresql://localhost:5433/facebook
    username: postgres
    password: harenafinaritra
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false



server:
  port: 9000
  servlet:
    context-path: /face-book-regression

# Logs Configuration
logging:
  level:
    root: TRACE
    org.hibernate.SQL: TRACE





app:
  config:
    column-visibility:
      file: ${user.dir}/config/column-visibility.json
  collecte:
    # Répertoire où seront écrits les CSV de trace après chaque collecte.
    csv-output-dir: ${user.dir}/output
  prediction:
    # Credentials PostgreSQL pour le pipeline d'entraînement Weka.
    # Ces valeurs peuvent être surchargées via les variables d'environnement
    # PREDICTION_DB_URL, PREDICTION_DB_USER, PREDICTION_DB_PASSWORD.
    db-url: ${PREDICTION_DB_URL:jdbc:postgresql://localhost:5433/facebook}
    db-user: ${PREDICTION_DB_USER:postgres}
    db-password: ${PREDICTION_DB_PASSWORD:harenafinaritra}


